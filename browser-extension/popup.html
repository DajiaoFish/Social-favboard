<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body {
    width: 288px;
    margin: 0;
    padding: 14px 16px 16px;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    color: #2c2c2a;
    background: #fff;
  }
  h1 { font-size: 14px; font-weight: 500; margin: 0 0 12px; }
  .status { display: flex; align-items: center; gap: 7px; margin-bottom: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #b4b2a9; flex: none; }
  .dot.on { background: #1d9e75; }
  .dot.off { background: #e24b4a; }
  .row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 0; border-top: 1px solid #f1efe8;
  }
  .row span { color: #888780; font-size: 12px; }
  .row b { font-weight: 500; }
  button {
    width: 100%; padding: 8px; margin-top: 8px; border: none; border-radius: 7px;
    font-size: 13px; font-family: inherit; cursor: pointer;
    background: #185fa5; color: #fff;
  }
  button:hover { background: #0c447c; }
  button.ghost { background: #f1efe8; color: #5f5e5a; }
  button.ghost:hover { background: #e8e6df; }
  .hint { margin: 12px 0 0; color: #888780; font-size: 11.5px; line-height: 1.6; }
  .msg { margin-top: 10px; font-size: 12px; color: #185fa5; min-height: 16px; }
  .msg.err { color: #a32d2d; }

  /* 总开关：最显眼的那一个 */
  button.power {
    margin: 0 0 4px;
    padding: 11px;
    font-size: 14px;
    background: #1d9e75;
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  button.power:hover { background: #17845f; }
  button.power::before {
    content: ""; width: 9px; height: 9px; border-radius: 50%;
    background: #fff; flex: none;
  }
  button.power.paused { background: #a32d2d; }
  button.power.paused:hover { background: #8c2424; }
  button.power.paused::before { background: #f7d9d9; }
  .powerHint {
    margin: 0 0 10px; color: #888780; font-size: 11.5px; text-align: center;
  }
</style>
</head>
<body>
  <h1>Social Favboard</h1>

  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">正在检查 Obsidian…</span>
  </div>

  <button id="toggle" class="power">暂停收集</button>
  <p class="powerHint" id="powerHint">正在收集，滚动页面时自动抓取</p>

  <div class="row"><span>暂存待发送</span><b id="pending">0</b></div>
  <div class="row"><span>本地端口</span><b id="port">—</b></div>
  <div class="row"><span>最近一条可用链接</span><b id="lastUrl" style="font-size:10.5px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">—</b></div>
  <div class="row"><span>版本</span><b id="ver">—</b></div>

  <button id="flush">立即发送到 Obsidian</button>
  <button id="clear" class="ghost">清空暂存</button>

  <div class="msg" id="msg"></div>

  <p class="hint">打开抖音 / B站 / 小红书的收藏或喜欢页，正常往下滚动，内容会自动收集。</p>

  <script src="popup.js"></script>
</body>
</html>
